<div class="auth-container">
  <div class="auth-card">
    <h2>Kreirajte nalog</h2>
    <p>Unesite vaše podatke kako biste se registrovali.</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Ime</label>
          <input type="text" id="name" formControlName="name" placeholder="Marko" />
        </div>
        <div class="form-group">
          <label for="surname">Prezime</label>
          <input type="text" id="surname" formControlName="surname" placeholder="Marković" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email adresa</label>
        <input type="email" id="email" formControlName="email" placeholder="marko.markovic@email.com" />
      </div>

      <div class="form-group">
        <label for="username">Korisničko ime</label>
        <input type="text" id="username" formControlName="username" placeholder="Unesite korisničko ime" />
      </div>

      <div class="form-group">
        <label for="password">Lozinka</label>
        <input type="password" id="password" formControlName="password" placeholder="Kreirajte lozinku" />
      </div>

      <div class="form-group">
        <label for="role">Izaberite ulogu</label>
        <select id="role" formControlName="role">
          <option value="" disabled selected>Izaberite ulogu...</option>
          <option *ngFor="let role of roles" [value]="role">
            {{ role.replace('ROLE_', '').replace('_', ' ') }}
          </option>
        </select>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-primary">Registrujte se</button>
    </form>

    <div class="auth-footer">
      Već imate nalog? <a routerLink="/login">Prijavite se</a>
    </div>
  </div>
</div>
