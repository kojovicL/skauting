<nav class="navbar">
  <div class="navbar-brand" (click)="onLogoClicked()">
    Fudbalski Klub
  </div>
  
  <div class="navbar-actions">
    <ng-container *ngIf="(isLoggedIn && userRole === 'ROLE_SCOUT')">
      <button class="nav-btn" (click)="onReportsClick()">Izveštaji</button>
      <button class="nav-btn" (click)="onRequestsClick()">Zahtevi</button>
      
      <!-- Notifications Bell & Popup -->
      <div class="notification-wrapper">
        <button class="icon-btn" (click)="toggleNotifications($event)">
          <!-- Zvonce SVG Ikona -->
          <svg xmlns="http://www.w3.org/-svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
          </svg>
          <span class="notification-badge" *ngIf="notifications.length > 0">
            {{ notifications.length > 99 ? '99+' : notifications.length }}
          </span>
        </button>

        <!-- Popup Menu -->
        <div class="notification-popup" *ngIf="showNotifications" (click)="$event.stopPropagation()">
          <div class="popup-header">Vaša obaveštenja</div>
          
          <div class="popup-body">
            <div class="no-notif" *ngIf="notifications.length === 0">
              Nemate novih nepročitanih obaveštenja.
            </div>
            
            <div class="notif-item" *ngFor="let notif of notifications" (click)="onNotificationClick(notif, $event)">
              <div class="notif-title">{{ notif.title }}</div>
              <div class="notif-message">{{ notif.message }}</div>
              <div class="notif-time">{{ notif.createdAt | date:'dd.MM.yyyy. HH:mm' }}</div>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="(isLoggedIn && userRole === 'ROLE_SPORTS_DIRECTOR')">
      <button class="nav-btn" (click)="onMetricsClick()">Metrike</button>
      <button class="nav-btn" (click)="onPlayerRecommendationClick()">Preporuka Igrača</button>
      <button class="nav-btn" (click)="onSeachTemplatesClick()">Šabloni Preporuke</button>
    </ng-container>

    <ng-container *ngIf="isLoggedIn">
      <button class="nav-btn logout-btn" (click)="onLogoutClick()">Izloguj Se</button>
    </ng-container>
    
    <ng-container *ngIf="!isLoggedIn">
      <button class="nav-btn login-btn" (click)="onLoginClick()">Uloguj Se</button>
    </ng-container>
  </div>
</nav>
