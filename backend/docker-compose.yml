version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-fudbal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d football_club" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgAdmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres-db:
        condition: service_healthy

  ai-rest-api:
    build:
      context: ./fk_ai_service
    container_name: fk_llm_rest_api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: fudbalski_klub/Dockerfile
    container_name: fudbalski-klub-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/football_club
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_NEO4J_URI: bolt://neo4j-db:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      INFLUXDB_URL: http://influx-db:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      FOOTBALL_AI_SERVICE_BASE_URL: http://ai-rest-api:8000
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL}
      FILE_UPLOAD_DIR: /app/uploads/images
    volumes:
      - app_images:/app/uploads/images

volumes:
  postgres_data:
  pgadmin_data:
  app_images: